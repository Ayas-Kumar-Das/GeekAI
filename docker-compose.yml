services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: geekai-postgres
    environment:
      POSTGRES_USER: geekai
      POSTGRES_PASSWORD: geekai123
      POSTGRES_DB: geekai
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geekai -d geekai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geekai-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://geekai:geekai123@postgres:5432/geekai
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      PYTHONUNBUFFERED: "1"
      CASHFREE_APP_ID: ""
      CASHFREE_SECRET_KEY: ""
      CASHFREE_ENV: "sandbox"
      BACKEND_URL: "http://localhost:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geekai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

